name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: false
        default: "1.0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "keystore restored: $(stat -c%s "$GITHUB_WORKSPACE/release.jks") bytes"
          else
            echo "::warning::KEYSTORE_BASE64 missing — APK debug key se sign hoga, updates ke liye uninstall karna padega"
          fi

      - name: Verify signing inputs
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            for v in KSP KA KP; do
              if [ -z "${!v}" ]; then
                echo "::error::$v missing hai par KEYSTORE_BASE64 set hai — keystore use nahi ho payega"
                exit 1
              fi
            done
            echo "all signing secrets present"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || '1.0' }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spy-app-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore
